name: Build and deploy LecTrace presentation

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - "figures/external_xai.png"
      - "lectrace.toml"
      - "requirements-lectrace.txt"
      - "website/**"
      - "report/MD6329_Report.pdf"
      - "figures/internal_ablation.png"
      - ".github/workflows/lectrace.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lectrace.txt
      - name: Install LecTrace
        run: python -m pip install -r requirements-lectrace.txt
      - name: Build presentation and project website
        run: |
          lectrace build --output _site/lectrace --no-incremental
          cp website/index.html website/styles.css website/script.js _site/
          mkdir -p _site/assets _site/report
          cp figures/internal_ablation.png figures/external_xai.png _site/assets/
          cp report/MD6329_Report.pdf _site/report/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
