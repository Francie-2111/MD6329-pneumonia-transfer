name: Build and deploy LecTrace presentation

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - "figures/external_xai.png"
      - "lectrace.toml"
      - "requirements-lectrace.txt"
      - ".github/workflows/lectrace.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lectrace.txt
      - name: Install LecTrace
        run: python -m pip install -r requirements-lectrace.txt
      - name: Build presentation
        run: lectrace build --output _site --no-incremental
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
